services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: kybern-taskhub
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: taskhub-backend
    restart: always
    depends_on:
      - mongodb
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/kybern-taskhub
      JWT_SECRET: my-super-secret-key

  frontend:
    build:
      context: ./frontend
    container_name: taskhub-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001/api

volumes:
  mongodb_data:
