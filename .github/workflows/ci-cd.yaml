name: Build and Deploy

on:
    push

jobs:
    build-backend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v6

            - name: Install Dependencies
              working-directory: ./backend
              run: npm install

            - name: Lint
              working-directory: ./backend
              run: npm run lint
              continue-on-error: true

            - name: Test
              working-directory: ./backend
              run: npm run test
            